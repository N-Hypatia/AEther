[pytest]
# Configuration pytest pour AEther
# Suivant les règles Kuro: 60% minimum de coverage

# Chemins de test
testpaths = tests

# Fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=60

# Marqueurs personnalisés
markers =
    unit: Tests unitaires (70% des tests)
    integration: Tests d'intégration (20% des tests)
    e2e: Tests de bout en bout (10% des tests)
    slow: Tests qui prennent du temps

# Configuration coverage
[coverage:run]
source = src
omit =
    tests/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False